name: Server Linux CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mongodb-probe:
    name: MongoDB read-only setup probe
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 15
    env:
      CI_MONGO_PORT: "37018"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Start isolated server MongoDB replica set
        run: /home/gandiv/.local/share/ci-tools/python/bin/python .github/ci/mongodb.py start
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove successful probes create no datastore artifacts
        env:
          KAVRIX_MONGODB_URI: mongodb://127.0.0.1:37018
        run: pnpm exec vitest run packages/storage/test/mongo-connection-probe.integration.test.ts

      - name: Stop isolated server MongoDB
        if: always()
        run: /home/gandiv/.local/share/ci-tools/python/bin/python .github/ci/mongodb.py stop

  static-checks:
    name: Static checks
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  verify:
    name: Verify (${{ matrix.label }})
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    # Windows shards run serially (see vitest.config.ts) and are
    # file-duration-skewed; hosted-runner variance has pushed an
    # acceptance-free shard past 90 minutes, so keep enough headroom for the
    # complete security suite instead of cancelling a valid run.
    # Packed-CLI acceptance runs in the parallel windows-acceptance job and
    # does not extend these shards.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Job-level `if` cannot use `matrix` (GitHub rejects the workflow). Select
        # the PR-trimmed vs full matrix via fromJSON instead of full_ci_only flags.
        include: [{"label": "Linux x64", "expected_arch": "x64", "shard": ""}]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # The development baseline, matching .nvmrc: the oldest LTS that marks
          # crypto.argon2 stable. The `runtime-range` job covers the wider range
          # `engines.node` promises, so this pin only needs to be reproducible.
          node-version: 24.19.0
          cache: pnpm
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        shell: bash
        run: node --input-type=module -e "if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - name: Build and test on this platform
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          pnpm build
          if [ -n "$SHARD" ]; then
            pnpm exec vitest run "--shard=$SHARD"
          else
            pnpm test
          fi

  runtime-range:
    name: Published CLI (${{ matrix.label }})
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `verify` covers every runner at one development baseline. This job covers
        # the other axis: the range `engines.node` actually promises to anyone
        # running `npm install -g kavrix`. Both edges are load-bearing.
        # 24.12.0 is the oldest runtime a user can install on, because
        # DatabaseSync.enableDefensive — which the local store calls to refuse
        # SQL that can corrupt the database file — was added in v25.1.0 and
        # backported no further than v24.12.0. Those two are also why 25.0.x is
        # excluded, so both edges of that gap are pinned here. The range is
        # deliberately open above 25.1.0, so the newest release guards against
        # drift in the release-candidate APIs the CLI depends on: node:sqlite is
        # stability 1.2, and crypto.argon2 only became stable in 24.19.0. Bump
        # `newest` when a Node major ships; a break there is a real break for
        # users already on it. macOS runs the floor only: newer-Node risk is API
        # drift rather than anything platform-specific, while the launcher shape
        # and path handling that do differ per OS are covered on Linux and Windows
        # at every version.
        # Job-level `if` cannot use `matrix`; PR trims to Linux floor + newest.
        include: [{"label": "Linux Node 24.12.0", "node": "24.12.0"}, {"label": "Linux Node 25.1.0", "node": "25.1.0"}, {"label": "Linux Node 26.7.0", "node": "26.7.0"}]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Verify the runtime under test
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        shell: bash
        run: node --input-type=module -e "if (process.versions.node !== process.env.EXPECTED_NODE) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test the runtime-sensitive packages
        run: >-
          pnpm --filter @kavrix/crypto
          --filter kavrix --fail-if-no-match test
      - name: Install and smoke-test the packed public CLI
        run: pnpm --filter kavrix --fail-if-no-match package:smoke

  dependency-audit:
    name: Dependency audit
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies (retry npm registry maintenance)
        shell: bash
        run: |
          set +e
          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            output="$(pnpm audit --audit-level high 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -Eqi '503|ERR_PNPM_AUDIT_BAD_RESPONSE|currently performing maintenance|status\.npmjs\.org'; then
              echo "npm audit endpoint unavailable (attempt $attempt/$max_attempts); retrying..."
              sleep $((attempt * 20))
              attempt=$((attempt + 1))
              continue
            fi
            exit "$status"
          done
          echo "::warning::npm audit skipped after $max_attempts attempts during registry maintenance (503)."
          exit 0

  package-dry-run:
    name: Package contents
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Detect public CLI package
        id: public_package
        shell: bash
        run: |
          if [[ -f apps/cli/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "The public CLI package does not exist yet; package inspection is intentionally skipped."
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.public_package.outputs.exists == 'true'
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.public_package.outputs.exists == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm build
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm --filter kavrix --fail-if-no-match pack --pack-destination package-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.public_package.outputs.exists == 'true'
        with:
          name: kavrix-package
          path: package-artifacts/*.tgz
          if-no-files-found: error

  active-release-hygiene:
    name: Active release hygiene
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build active release workspaces for coverage
        run: pnpm build
      - name: Enforce active-source coverage
        run: pnpm test:coverage
