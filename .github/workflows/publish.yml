name: Publish npm package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
      package_version: ${{ steps.package.outputs.package_version }}
    steps:
      - name: Require the reviewed public repository
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        shell: bash
        run: test "$REPOSITORY_VISIBILITY" = 'public'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Require the tagged commit on main with exact-SHA CI and CodeQL
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tagged_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$tagged_commit"
          git merge-base --is-ancestor "$tagged_commit" "$main_commit"
          export TAGGED_COMMIT="$tagged_commit"
          node apps/cli/scripts/require-workflow-runs.js \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml
      # STOP: Do not add signature verification until the product decision names
      # the exact allowed signer fingerprint and rotation/revocation policy.
      - name: Require the public CLI package
        shell: bash
        run: test -f apps/cli/package.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Match the package version, release type, tag, and npm channel
        id: release
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolveReleaseChannel } from './apps/cli/scripts/require-workflow-runs.js';
          const manifest = JSON.parse(readFileSync('apps/cli/package.json', 'utf8'));
          if (!['false', 'true'].includes(process.env.RELEASE_PRERELEASE)) {
            throw new Error('GitHub release prerelease state is invalid.');
          }
          const npmDistTag = resolveReleaseChannel(
            manifest.version,
            process.env.RELEASE_PRERELEASE === 'true',
          );
          if (process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match kavrix@${manifest.version}.`);
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `npm_dist_tag=${npmDistTag}\n`,
            { encoding: 'utf8' },
          );
          NODE
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
      - name: Reject token-based npm authentication
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const prohibited = Object.keys(process.env).filter(
            (name) => /^(?:NODE_AUTH_TOKEN|NPM_TOKEN)$/u.test(name) &&
              process.env[name]?.length > 0,
          );
          if (prohibited.length > 0) {
            throw new Error(`Long-lived npm authentication is forbidden: ${prohibited.join(', ')}.`);
          }
          NODE
          if git grep --line-number '_authToken' -- '*.npmrc'; then
            echo 'Long-lived npm authentication is forbidden.' >&2
            exit 1
          fi
      - name: Refresh high-severity dependency advisories
        run: pnpm audit --audit-level high
      - name: Pack the release archive exactly once
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/cli/package.json').version")"
          archive_name="kavrix-${version}.tgz"
          test ! -e package-artifacts
          mkdir package-artifacts
          pnpm --filter kavrix --fail-if-no-match pack \
            --pack-destination package-artifacts
          archive="$PWD/package-artifacts/$archive_name"
          test -f "$archive"
          mapfile -t archives < <(find package-artifacts -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#archives[@]}" -eq 1
          test "${archives[0]}" = "package-artifacts/$archive_name"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=kavrix-release-candidate-$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
      - name: Inspect and smoke-test the exact release archive
        env:
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          node apps/cli/scripts/smoke-packed-package.js "$PACKAGE_ARCHIVE"
          inspection="$(mktemp -d)"
          trap 'rm -rf -- "$inspection"' EXIT
          tar -xzf "$PACKAGE_ARCHIVE" -C "$inspection" \
            --no-same-owner --no-same-permissions
          bin="$inspection/package/dist/bin.js"
          readme="$inspection/package/README.md"
          sbom="$inspection/package/dist/kavrix.cdx.json"
          for notice in \
            'commander@15.0.0 (MIT)' \
            'zod@4.4.3 (MIT)' \
            'libsodium-wrappers@0.8.4 (ISC)' \
            'libsodium@0.8.4 (ISC)'; do
            grep --fixed-strings "$notice" "$bin" >/dev/null
          done
          for attribution in \
            'EFF Short Wordlist for Passphrases #1' \
            'https://www.eff.org/files/2016/09/08/eff_short_wordlist_1.txt' \
            'https://creativecommons.org/licenses/by/4.0/' \
            'dice-code column'; do
            grep --fixed-strings "$attribution" "$readme" >/dev/null
          done
          for sbom_marker in \
            'pkg:npm/commander@15.0.0' \
            'pkg:npm/zod@4.4.3' \
            'pkg:npm/libsodium-wrappers@0.8.4' \
            'pkg:npm/libsodium@0.8.4' \
            'urn:kavrix:data:eff-short-wordlist-for-passphrases-1' \
            'CC-BY-4.0' \
            'kavrix:source-sha256' \
            '8f5ca830b8bffb6fe39c9736c024a00a6a6411adb3f83a9be8bfeeb6e067ae69'; do
            grep --fixed-strings "$sbom_marker" "$sbom" >/dev/null
          done
          if grep --recursive --binary-files=text --extended-regexp \
            'workspace:|secret-password-canary|secret-note-canary|runtime-vault-secret-canary|KAVRIX-BACKUP-PLAINTEXT-CANARY|plaintext-storage-canary|unique-plaintext-canary-7ac19783|canary-plaintext-value' \
            "$inspection/package"; then
            echo 'A workspace protocol or plaintext canary reached the archive.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: package-artifacts/${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Reject token-based npm authentication
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: package-artifacts
      - name: Validate the sole approved release archive
        env:
          EXPECTED_ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
          EXPECTED_NPM_DIST_TAG: ${{ needs.validate.outputs.npm_dist_tag }}
          EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          PACKAGE_ARCHIVE: package-artifacts/${{ needs.validate.outputs.archive_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REPOSITORY_VISIBILITY" = 'public'
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$EXPECTED_PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            test "$RELEASE_PRERELEASE" = 'false'
            test "$EXPECTED_NPM_DIST_TAG" = 'latest'
          elif [[ "$EXPECTED_PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            test "$RELEASE_PRERELEASE" = 'true'
            test "$EXPECTED_NPM_DIST_TAG" = 'beta'
          else
            echo 'Release version, prerelease flag, and npm dist-tag do not match policy.' >&2
            exit 1
          fi
          test "$RELEASE_TAG" = "v$EXPECTED_PACKAGE_VERSION"
          test "$EXPECTED_ARCHIVE_NAME" = "kavrix-$EXPECTED_PACKAGE_VERSION.tgz"
          test "$PACKAGE_ARCHIVE" = "package-artifacts/$EXPECTED_ARCHIVE_NAME"
          mapfile -t entries < <(find package-artifacts -mindepth 1 -maxdepth 1 -print)
          test "${#entries[@]}" -eq 1
          test "${entries[0]}" = "$PACKAGE_ARCHIVE"
          test -f "$PACKAGE_ARCHIVE"
          actual_sha256="$(sha256sum "$PACKAGE_ARCHIVE" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_ARCHIVE_SHA256"
          node --input-type=module - "$PACKAGE_ARCHIVE" "$EXPECTED_PACKAGE_VERSION" <<'NODE'
          import { execFileSync } from 'node:child_process';
          const [archive, expectedVersion] = process.argv.slice(2);
          const manifest = JSON.parse(execFileSync(
            'tar',
            ['-xOf', archive, 'package/package.json'],
            { encoding: 'utf8', timeout: 10_000 },
          ));
          if (
            manifest.name !== 'kavrix' ||
            manifest.version !== expectedVersion ||
            manifest.private !== false ||
            manifest.publishConfig?.access !== 'public' ||
            manifest.publishConfig?.registry !== 'https://registry.npmjs.org/'
          ) {
            throw new Error('The downloaded archive manifest violates release policy.');
          }
          NODE
      - name: Publish the inspected archive through npm OIDC
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.npm_dist_tag }}
          PACKAGE_ARCHIVE: package-artifacts/${{ needs.validate.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          npm publish "$PACKAGE_ARCHIVE" \
            --ignore-scripts \
            --access public \
            --tag "$NPM_DIST_TAG" \
            --provenance
