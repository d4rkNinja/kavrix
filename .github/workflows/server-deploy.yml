name: Deploy selected branch to server
run-name: "Server ${{ inputs.mode }} — ${{ inputs.branch }}"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Select branch to build/deploy (list refreshes every 5 minutes)
        required: true
        type: choice
        default: "main"
        options:
          - "main"
          - "ci/windows-verify-faster"
          - "development"
          - "fix/0.2.15-windows-ci-flakes"
          - "fix/0.2.19-live-qa-p1s"
          - "fix/0.2.19-live-qa-p2-ux"
          - "fix/0.2.20-qa-and-tui-release"
          - "fix/0.2.21-windows-heal"
          - "fix/ci-0.2.14-lint-smoke"
          - "fix/ci-0214-lint-smoke"
          - "fix/ci-after-153-file-default"
          - "fix/p1-followups-0.2.14"
      mode:
        description: "Build and deploy runs validation, build and activation; build only verifies; validate checks configuration"
        required: true
        type: choice
        default: "Build and deploy"
        options:
          - "Build and deploy"
          - build
          - deploy
          - validate
permissions:
  contents: read
concurrency:
  group: sudarsan-production
  cancel-in-progress: false
jobs:
  deploy:
    # Always use the reviewed default-branch deployment code, even for old branches.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, sudarsan-d4rkninja-kavrix]
    timeout-minutes: 90
    environment: server-production
    steps:
      - name: Validate branch name
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        run: git check-ref-format "refs/heads/$DEPLOY_BRANCH"
      - name: Checkout trusted deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Checkout selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.branch }}
          path: source
          persist-credentials: false
      - name: Build or deploy selected branch
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          DEPLOY_MODE: ${{ inputs.mode == 'Build and deploy' && 'deploy' || inputs.mode }}
        run: python3 control/.github/deploy/deploy.py --config control/.github/deploy/server.json --source source --mode "$DEPLOY_MODE"
