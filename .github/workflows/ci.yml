name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            expected_arch: x64
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            expected_arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            expected_arch: x64
          - label: macOS arm64
            runner: macos-15
            expected_arch: arm64
          # Windows executes the suite serially (fileParallelism is off for the
          # process-boundary security tests), so it alone dominates the CI wall
          # clock. The suite is split across shards; acceptance and the packed
          # CLI smoke run once, on the first shard.
          - label: Windows x64 · shard 1/3
            runner: windows-2025
            expected_arch: x64
            shard: 1/3
            runs_acceptance: true
          - label: Windows x64 · shard 2/3
            runner: windows-2025
            expected_arch: x64
            shard: 2/3
          - label: Windows x64 · shard 3/3
            runner: windows-2025
            expected_arch: x64
            shard: 3/3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # The development baseline, matching .nvmrc: the oldest LTS that marks
          # crypto.argon2 stable. The `runtime-range` job covers the wider range
          # `engines.node` promises, so this pin only needs to be reproducible.
          node-version: 24.19.0
          cache: pnpm
          package-manager-cache: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        shell: bash
        run: node --input-type=module -e "if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - name: Build and test on this platform
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          pnpm build
          if [ -n "$SHARD" ]; then
            pnpm exec vitest run "--shard=$SHARD"
          else
            pnpm test
          fi
      - name: Exercise packed database profiles, multi-vault storage, and migration
        if: ${{ matrix.runs_acceptance == true }}
        run: pnpm acceptance:database-container
      - name: Exercise every applicable command through the packed local-file CLI
        if: ${{ matrix.runs_acceptance == true }}
        run: pnpm acceptance:pre-ci
      - name: Install and smoke-test the packed public CLI
        if: ${{ matrix.runs_acceptance == true }}
        run: pnpm --filter kavrix --fail-if-no-match package:smoke

  runtime-range:
    name: Published CLI (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `verify` covers every runner at one development baseline. This job covers
        # the other axis: the range `engines.node` actually promises to anyone
        # running `npm install -g kavrix`. Both edges are load-bearing.
        # 24.12.0 is the oldest runtime a user can install on, because
        # DatabaseSync.enableDefensive — which the local store calls to refuse
        # SQL that can corrupt the database file — was added in v25.1.0 and
        # backported no further than v24.12.0. Those two are also why 25.0.x is
        # excluded, so both edges of that gap are pinned here. The range is
        # deliberately open above 25.1.0, so the newest release guards against
        # drift in the release-candidate APIs the CLI depends on: node:sqlite is
        # stability 1.2, and crypto.argon2 only became stable in 24.19.0. Bump
        # `newest` when a Node major ships; a break there is a real break for
        # users already on it. macOS runs the floor only: newer-Node risk is API
        # drift rather than anything platform-specific, while the launcher shape
        # and path handling that do differ per OS are covered on Linux and Windows
        # at every version.
        include:
          - label: Linux · Node 24.12.0 · engines floor
            runner: ubuntu-24.04
            node: 24.12.0
          - label: Windows · Node 24.12.0 · engines floor
            runner: windows-2025
            node: 24.12.0
          - label: macOS · Node 24.12.0 · engines floor
            runner: macos-15
            node: 24.12.0
          - label: Linux · Node 25.1.0
            runner: ubuntu-24.04
            node: 25.1.0
          - label: Windows · Node 25.1.0
            runner: windows-2025
            node: 25.1.0
          - label: Linux · Node 26.7.0 · newest
            runner: ubuntu-24.04
            node: 26.7.0
          - label: Windows · Node 26.7.0 · newest
            runner: windows-2025
            node: 26.7.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false
      - name: Verify the runtime under test
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        shell: bash
        run: node --input-type=module -e "if (process.versions.node !== process.env.EXPECTED_NODE) process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test the runtime-sensitive packages
        run: >-
          pnpm --filter @kavrix/crypto
          --filter kavrix --fail-if-no-match test
      - name: Install and smoke-test the packed public CLI
        run: pnpm --filter kavrix --fail-if-no-match package:smoke

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high

  package-dry-run:
    name: Package contents
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Detect public CLI package
        id: public_package
        shell: bash
        run: |
          if [[ -f apps/cli/package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "The public CLI package does not exist yet; package inspection is intentionally skipped."
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.public_package.outputs.exists == 'true'
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.public_package.outputs.exists == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
          package-manager-cache: false
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm build
      - if: steps.public_package.outputs.exists == 'true'
        run: pnpm --filter kavrix --fail-if-no-match pack --pack-destination package-artifacts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.public_package.outputs.exists == 'true'
        with:
          name: kavrix-package
          path: package-artifacts/*.tgz
          if-no-files-found: error

  active-release-hygiene:
    name: Active release hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Reject stale Changesets
        run: pnpm changeset status
      - name: Build active release workspaces for coverage
        run: pnpm build
      - name: Enforce active-source coverage
        run: pnpm test:coverage
