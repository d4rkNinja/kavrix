packages:
  - apps/cli
  - packages/core
  - packages/schemas
  - packages/crypto
  - packages/key-files
  - packages/storage
  - packages/runner
  - packages/tui

strictPeerDependencies: true
preferWorkspacePackages: true
autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  # Reviewed fix for GHSA-68fv-2mgg-jv7q; scope the age exception to this patch.
  - source-map-js@1.2.2
trustPolicy: no-downgrade

overrides:
  'brace-expansion@>=4.0.0 <5.0.11': '>=5.0.11'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'

allowBuilds:
  esbuild: true

catalog:
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  chalk: 5.6.2
  commander: 15.0.0
  fast-check: 4.9.0
  fastify: 5.11.0
  ink: 7.1.1
  libsodium-wrappers: 0.8.4
  mongodb: 7.5.0
  react: 19.2.8
  zod: 4.4.3
