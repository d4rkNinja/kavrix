packages:
  - apps/cli
  - packages/schemas
  - packages/crypto
  - packages/key-files
  - packages/storage
  - packages/runner
  - packages/tui

strictPeerDependencies: true
preferWorkspacePackages: true
autoInstallPeers: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - nanoid@3.3.18
trustPolicy: no-downgrade

overrides:
  kavrix: link:apps/cli

allowBuilds:
  esbuild: true

catalog:
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  chalk: 5.6.2
  commander: 15.0.0
  fast-check: 4.9.0
  fastify: 5.11.0
  ink: 7.1.1
  libsodium-wrappers: 0.8.4
  mongodb: 7.5.0
  react: 19.2.8
  smol-toml: 1.3.1
  '@napi-rs/keyring': 1.3.0
  zod: 4.4.3
